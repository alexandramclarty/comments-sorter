<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comment Sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/docx@9.6.1/dist/index.iife.js"></script>
<style>
:root {
  --paper: #F4F6F9;
  --surface: #FFFFFF;
  --ink: #1C2536;
  --ink-2: #4F5B70;
  --ink-3: #7C879A;
  --line: #DCE1E9;
  --line-2: #C3CAD6;
  --navy: #002F87;
  --navy-h: #0B3FA6;
  --navy-soft: #E8EDF7;
  --plum: #93278F;
  --mark: #FFE48A;
  --skip: #9AA3B2;
  --danger: #B42318;
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--ui); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--navy); }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.small { font-size: 0.867rem; }
kbd { font: 600 0.75rem var(--ui); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); color: var(--ink-2); white-space: nowrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.primary:hover { background: var(--navy-h); }
.btn.primary kbd { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--navy); padding: 6px 8px; }
.btn.quiet:hover { background: var(--navy-soft); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 0.867rem; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--navy); text-decoration: underline; cursor: pointer; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 16px; padding: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; white-space: nowrap; }
.brand svg { flex: none; }
.projname { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.spacer { flex: 1; }
.savestate { color: var(--ink-3); font-size: 0.8rem; white-space: nowrap; }
.savestate.warn { color: var(--danger); }
.progress { height: 4px; background: var(--line); display: flex; }
.progress span { display: block; height: 100%; }
.progress .p-rev { background: var(--navy); }
.progress .p-skip { background: var(--skip); }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(28,37,54,.12); padding: 6px; min-width: 230px; display: grid; }
.menu-list button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 5px; cursor: pointer; }
.menu-list button:hover { background: var(--navy-soft); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

/* Tabs */
.tabs { display: flex; gap: 4px; padding: 0 20px; }
.tab { border: 0; background: none; padding: 10px 12px 9px; cursor: pointer; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--navy); }
.tab .count { color: var(--ink-3); font-weight: 400; margin-left: 4px; }

/* Landing */
.landing { max-width: 720px; margin: 64px auto; padding: 0 20px; }
.landing h1 { font-size: 2.25rem; margin-bottom: 12px; }
.landing .lede { font-size: 1.1rem; color: var(--ink-2); max-width: 60ch; margin-bottom: 28px; }
.drop { display: grid; place-items: center; gap: 6px; text-align: center; padding: 44px 20px; border: 2px dashed var(--line-2); border-radius: 12px; background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--navy); background: var(--navy-soft); }
.drop strong { font-size: 1.1rem; color: var(--navy); }
.drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.resume { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.resume .grow { flex: 1; min-width: 200px; }
.landing .alt { margin-top: 18px; }
.privacy { margin-top: 36px; color: var(--ink-3); font-size: 0.867rem; max-width: 60ch; }
.error { color: var(--danger); margin-top: 14px; }

/* Setup */
.setup { max-width: 1120px; margin: 32px auto 64px; padding: 0 20px; }
.setup-head { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
.setup-head .grow { flex: 1; min-width: 260px; }
.note { background: var(--navy-soft); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; color: var(--ink); }
.field { display: grid; gap: 4px; }
.field > span { font-weight: 600; font-size: 0.867rem; }
.input, select.input, textarea.input { border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 10px; background: var(--surface); width: 100%; }
textarea.input { resize: vertical; }
.fields-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.fields-row .field { min-width: 240px; flex: 1; }
.coltable-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 0.8rem; font-weight: 600; color: var(--ink-2); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.colname { font-weight: 600; max-width: 240px; overflow-wrap: anywhere; }
.hint { display: block; font-weight: 400; font-size: 0.8rem; color: var(--ink-3); }
.example { color: var(--ink-2); max-width: 300px; font-size: 0.867rem; }
.example span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; padding: 5px 11px; font-size: 0.867rem; cursor: pointer; border-left: 1px solid var(--line-2); white-space: nowrap; }
.seg label:first-child span { border-left: 0; }
.seg input:checked + span { background: var(--navy); color: #fff; }
.seg input:focus-visible + span { outline: 2px solid var(--navy); outline-offset: -3px; }
tr.role-skip td:not(:nth-child(4)) { color: var(--ink-3); }
.setup-foot { display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }

/* Workspace */
.work { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 100px); }
.work.full { grid-template-columns: minmax(0, 1fr); }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 18px 16px 40px; display: grid; gap: 22px; align-content: start; position: sticky; top: 100px; max-height: calc(100vh - 100px); overflow-y: auto; }
.side h3 { font-size: 0.8rem; color: var(--ink-2); margin-bottom: 6px; }
.statuslist { display: grid; gap: 2px; }
.statuslist button, .taglist button.tagbtn { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.statuslist button:hover, .taglist button.tagbtn:hover { background: var(--paper); }
.statuslist button[aria-pressed="true"], .taglist button.tagbtn[aria-pressed="true"] { background: var(--navy-soft); color: var(--navy); font-weight: 600; }
.num { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; font-weight: 400; }
.taglist { display: grid; gap: 1px; }
.tagrowside { display: flex; align-items: center; position: relative; }
.tagrowside .tagbtn { padding-right: 34px !important; }
.tagrowside .xbtn { position: absolute; right: 2px; opacity: 0; }
.tagrowside:hover .xbtn, .tagrowside .xbtn:focus-visible { opacity: 1; }
.xbtn { border: 0; background: none; width: 26px; height: 26px; border-radius: 5px; cursor: pointer; color: var(--ink-3); display: grid; place-items: center; }
.xbtn:hover { background: var(--line); color: var(--ink); }
.bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--navy); }
.tagname { min-width: 0; flex: 1; }
.tagname .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .field select, .side .field input { font-size: 0.933rem; }
.main { padding: 22px 28px 60px; min-width: 0; }

/* Review */
.review { max-width: 820px; margin: 0 auto; }
.qbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 26px 20px; }
.card-q { display: flex; align-items: center; gap: 10px; color: var(--plum); font-weight: 600; font-size: 0.867rem; margin-bottom: 12px; flex-wrap: wrap; }
.badge { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--paper); color: var(--ink-2); border: 1px solid var(--line); }
.badge.rev { background: var(--navy-soft); color: var(--navy); border-color: transparent; }
.comment-text { font-family: var(--read); font-size: 1.4rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 64ch; }
.comment-text.sm { font-size: 1.1rem; line-height: 1.5; }
mark { background: linear-gradient(transparent 14%, var(--mark) 14%, var(--mark) 90%, transparent 90%); color: inherit; padding: 0 1px; }
.ctx { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; color: var(--ink-2); font-size: 0.867rem; }
.ctx b { font-weight: 600; color: var(--ink-3); }
.tagzone { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 6px 3px 12px; font-size: 0.9rem; border: 1.5px solid var(--navy); cursor: pointer; background: var(--surface); color: var(--navy); line-height: 1.4; }
.chip.conf { background: var(--navy); color: #fff; }
.chip.sugg { border-style: dashed; }
.chip .n { font-size: 0.75rem; opacity: .75; font-variant-numeric: tabular-nums; }
.chip .x { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; }
.chip:hover .x { background: rgba(127,127,127,.25); }
.chip.add { border-color: var(--line-2); color: var(--ink-2); padding: 3px 12px; }
.chip.add:hover { border-color: var(--navy); color: var(--navy); }
.chip.add .n { margin-right: 2px; }
.chips-empty { color: var(--ink-3); font-style: italic; }
.zlabel { font-size: 0.8rem; font-weight: 600; color: var(--ink-2); min-width: 64px; }
.addrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.addrow .input { width: 240px; }
.others { margin-top: 16px; font-size: 0.933rem; }
.others summary { cursor: pointer; color: var(--ink-2); }
.others dl { margin: 10px 0 0; display: grid; gap: 10px; }
.others dt { font-weight: 600; font-size: 0.8rem; color: var(--plum); }
.others dd { margin: 2px 0 0; font-family: var(--read); font-size: 1.02rem; }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.keys { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-3); font-size: 0.8rem; margin-top: 18px; }
.keys span { display: inline-flex; gap: 5px; align-items: center; }
.empty { text-align: center; padding: 60px 20px; color: var(--ink-2); display: grid; gap: 14px; justify-items: center; }
.empty h2 { color: var(--ink); }

/* Browse */
.browse-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.blist { display: grid; gap: 10px; }
.bcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; display: grid; gap: 10px; }
.bcard.is-skip { background: transparent; }
.bcard.is-skip .comment-text { color: var(--ink-3); }
.bcard .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bcard .top .q { color: var(--plum); font-weight: 600; font-size: 0.8rem; }
.bcard .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bcard .foot .input { width: 180px; padding: 4px 8px; font-size: 0.867rem; }
.bcard .ctx { margin-top: 0; }
.more { margin-top: 16px; text-align: center; }

/* Tags tab */
.tagspage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; max-width: 1240px; margin: 0 auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-b { padding: 16px 18px; display: grid; gap: 12px; }
.panel + .panel { margin-top: 18px; }
.ttable td { font-size: 0.933rem; }
.ttable .terms { color: var(--ink-2); max-width: 340px; }
.ttable .kind { display: block; font-size: 0.75rem; color: var(--ink-3); }
.ttable td.num { text-align: right; }
.ttable .acts { display: flex; gap: 4px; justify-content: flex-end; align-items: center; }
.ttable select { font-size: 0.8rem; padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 5px; background: var(--surface); max-width: 130px; }
.wordchips { display: flex; flex-wrap: wrap; gap: 6px; }
.wchip { display: inline-flex; align-items: center; gap: 2px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 1px 2px 1px 10px; font-size: 0.867rem; }
.wchip .xbtn { width: 22px; height: 22px; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline .input { flex: 1; min-width: 120px; }
.numinput { width: 80px !important; flex: none !important; }

/* Export */
.exportpage { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 28px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--navy); }
.check small { display: block; color: var(--ink-3); }
.warnbox { background: #FFF7E0; border: 1px solid #F0D58A; border-radius: 8px; padding: 10px 14px; }
.clouds { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
.cloud { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.cloud canvas { width: 100%; height: auto; display: block; }
.cloud .cap { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--surface); }
.dlrow { display: flex; gap: 10px; flex-wrap: wrap; }

/* Dialog */
dialog { border: 0; border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(28,37,54,.25); color: var(--ink); }
dialog::backdrop { background: rgba(28,37,54,.35); }
dialog form { padding: 22px 24px; display: grid; gap: 14px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.forms { display: flex; flex-wrap: wrap; gap: 6px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 50; font-size: 0.933rem; max-width: calc(100vw - 40px); }

@media (max-width: 900px) {
  .work { display: flex; flex-direction: column; }
  .main { order: 1; }
  .side { order: 2; position: static; max-height: none; border-right: 0; border-top: 1px solid var(--line); }
  .topbar-in { gap: 10px; padding: 10px 14px; }
  .topbar-in > .small.muted { display: none; }
  .tabs { overflow-x: auto; padding: 0 8px; }
  .tab { white-space: nowrap; }
  .tagspage { grid-template-columns: minmax(0, 1fr); }
  .main { padding: 18px 14px 48px; }
  .card { padding: 18px 16px; }
  .comment-text { font-size: 1.2rem; }
  .projname, .savestate { display: none; }
  .clouds { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<div id="app"></div>
<dialog id="dlg"></dialog>
<datalist id="taglist"></datalist>
<input type="file" id="fileProject" accept=".json,application/json" hidden>
<input type="file" id="fileCodebook" accept=".json,application/json" hidden>

<script>
"use strict";
/* =====================================================================
   Comment Sorter — tag open-response survey comments, export to Word.
   Everything runs in the browser. Libraries: SheetJS (read/write Excel),
   docx (write Word). No AI, no server.
   ===================================================================== */

/* ---------- Word lists ---------- */
const CORE_STOP = new Set(("a about above after again against all am an and any are aren arent as at be because been before being below between both but by can cant cannot could couldnt couldve did didnt do does doesnt doing dont down during each etc few for from further get gets got getting had hadnt has hasnt have havent having he hed hes her here heres hers herself him himself his how hows i id ill im ive if in into is isnt it its itself lets me more most mustnt my myself no nor not of off on once only or other ought our ours ourselves out over own same shant she shed shes should shouldnt so some such than that thats the their theirs them themselves then there theres these they theyd theyll theyre theyve this those through to too under until up us very was wasnt we wed well were weve werent what whats when whens where wheres which while who whos whom why whys will with wont would wouldnt wouldve you youd youll youre youve your yours yourself yourselves also just yes yeah oh ok okay may might must shall one two three maybe perhaps even still though although however really quite rather much many lot lots bit little able way ways something anything everyone someone anyone thing things stuff u ur n na nope via per sure yet along go going goes gone make makes made think know knew need want wanted use give gave take took come came put say said tell told seem seemed feel felt lol see saw seen nothing none").split(" "));

const STARTER_EXCLUSIONS = ["session", "workshop", "webinar", "training", "today", "great", "good", "nice", "helpful", "useful", "excellent", "amazing", "fantastic", "awesome", "wonderful", "love", "enjoy", "job", "part", "help", "provide", "overall", "definitely", "especially", "always", "keep"];

const STARTER_TAGS = [
  { name: "presenter", terms: ["presenter", "speaker", "facilitator"] },
  { name: "slides", terms: ["slides", "PowerPoint", "slide deck"] },
  { name: "pace", terms: ["pace", "pacing", "rushed", "too fast", "slow down"] },
  { name: "audio", terms: ["audio", "sound", "mic", "microphone"] },
  { name: "examples", terms: ["example", "sample"] },
  { name: "practice", terms: ["practice", "hands-on", "work time"] },
  { name: "games", terms: ["game", "Kahoot", "quiz"] },
  { name: "appreciation", terms: ["thank", "thanks", "kudos", "appreciate", "grateful", "great job", "well done", "great work"] },
  { name: "eCampus", terms: ["eCampus", "e-campus", "Brightspace", "D2L"] },
  { name: "recordings", terms: ["recording", "recorded", "video"] },
  { name: "breakout rooms", terms: ["breakout", "breakout room", "small group"] }
];

const BLANK_EXACT = new Set(["", "n a", "na", "n", "none", "nothing", "no", "nope", "nah", "not applicable", "no comment", "no comments", "no change", "no changes", "no suggestion", "no suggestions", "no recommendation", "no recommendations", "nothing to add", "nothing to add here", "nothing else", "nothing further", "nothing to say", "nothing at this time", "none at this time", "not at this time", "nothing really", "none really", "not really", "no thanks", "no thank you", "none thank you", "nothing thank you", "cant think of anything", "cant think of any", "i cant think of anything", "i cant think of any", "i dont have anything", "i dont have any", "not sure", "idk", "x", "same", "same as above", "see above", "nothing comes to mind", "none that i can think of", "nothing that i can think of", "no other comments", "no additional comments", "no further comments", "nothing additional", "none so far", "nothing so far"]);

const PALETTES = {
  cetl: { name: "CETL", colors: ["#002F87", "#1E8EF7", "#93278F", "#FF620B", "#E52626"] },
  fellows: { name: "Fellows", colors: ["#1B75BB", "#062F87", "#652D90", "#9E1F63"] },
  navy: { name: "Navy only", colors: ["#002F87"] }
};

async function openFile(file) {
  UI.err = "";

    if (/\.json$/i.test(file.name)) return openProjectFile(file);
    if (!window.XLSX) throw new Error("The Excel reader didn't load. Check your internet connection and reload the page.");
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const sheets = wb.SheetNames.map((n) => sheetTable(wb.Sheets[n], n)).filter((s) => s.headers.length && s.rows.length);
    if (!sheets.length) throw new Error("No data found in that file. Check that the responses are on a worksheet with a header row.");

    T = { fileName: file.name, sheets, sheetIdx: 0, title: titleFromFile(file.name), cols: draftFromSheet(sheets[0]), codebook: cb ? "saved" : "starter", editing: false };
    UI.view = "setup"; render();
  } catch (e) { UI.err = e.message || String(e); render(); }
}
async function openProjectFile(file) {
  try {
    const obj = JSON.parse(await file.text());

}

function startProject() {

  if (T.editing && P) {

      headers: sheet.headers, rows: sheet.rows, rowNums: sheet.rowNums, note: sheet.note, cols, status: {}, codebook: cb,

function recount() {
  const counts = new Map();
  for (const c of D.comments) {
    if (isSkipped(c)) continue;
    const { conf, sugg } = tagsOf(c);
    for (const [list, kind] of [[conf, "c"], [sugg, "s"]]) for (const id of list) {
      if (!counts.has(id)) counts.set(id, { c: 0, s: 0, col: new Map() });
      const o = counts.get(id); o[kind]++;
      if (!o.col.has(c.c)) o.col.set(c.c, { c: 0, s: 0 });
      o.col.get(c.c)[kind]++;
    }
  }
  D.counts = counts;
}
function tagCount(id, col) {
  const o = D.counts.get(id); if (!o) return { c: 0, s: 0, t: 0 };
  const x = col == null || col === "all" ? o : (o.col.get(+col) || { c: 0, s: 0 });
  return { c: x.c, s: x.s, t: x.c + x.s };
}
function refreshDatalist() {
  const dl = $("#taglist"); if (!dl || !D) return;
  const names = [...new Set([...D.tags.values()].map((t) => t.name))].sort((a, b) => a.localeCompare(b));
  dl.innerHTML = names.map((n) => `<option value="${esc(n)}"></option>`).join("");
}
function findTagByName(name) {
  const n = name.trim().toLowerCase(); if (!n) return null;
  for (const t of D.tags.values()) if (t.name.toLowerCase() === n) return t;
  for (const t of D.tags.values()) if (t.terms.some((x) => x.toLowerCase() === n)) return t;
  return null;
}

/* ---------- Filtering & queue ---------- */
function passes(c, f, ignore = {}) {
  if (f.col !== "all" && c.c !== +f.col) return false;
  if (!ignore.status) {
    const sk = isSkipped(c), s = st(c.id);
    if (f.status === "todo" && (sk || s.v)) return false;
    if (f.status === "reviewed" && (sk || !s.v)) return false;
    if (f.status === "skipped" && !sk) return false;
    if (f.status === "untagged") { if (sk) return false; const t = tagsOf(c); if (t.conf.length || t.sugg.length) return false; }
  }
  for (const [ci, val] of Object.entries(f.ctx)) if (val !== "" && (P.rows[c.r][ci] || "") !== val) return false;
  if (!ignore.tag && f.tag && !hasTag(c, f.tag)) return false;
  if (f.q && !c.text.toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
}
function filtered() { return D.comments.filter((c) => passes(c, UI.f)); }
function buildQueue(keepId) {
  UI.queue = filtered().map((c) => c.id);
  UI.qkey = JSON.stringify(UI.f);
  const i = keepId ? UI.queue.indexOf(keepId) : -1;
  UI.qpos = i >= 0 ? i : 0;
}

/* ---------- Status actions ---------- */
function confirmAll(c) {
  const s = stw(c.id), { conf, sugg } = tagsOf(c);
  s.c = [...conf, ...sugg]; s.v = 1;
}
function removeTag(c, id) {
  const s = stw(c.id);
  s.c = (s.c || []).filter((x) => x !== id);
  if (c.matches.has(id)) { s.r = s.r || []; if (!s.r.includes(id)) s.r.push(id); }
}
function addTag(c, id) {
  const s = stw(c.id);
  s.c = s.c || []; if (!s.c.includes(id)) s.c.push(id);
  s.r = (s.r || []).filter((x) => x !== id);
}
function toggleSkip(c) { const s = stw(c.id); s.s = !isSkipped(c); }
function changed(opts = {}) {
  if (opts.derive) derive(); else recount();
  saveSoon(); render();
}
function tagFromInput(value) {
  const name = value.trim(); if (!name) return null;
  const hit = findTagByName(name); if (hit) return hit.id;
  const t = { id: "t:" + uid(), name, terms: [name] };
  P.codebook.tags.push(t); derive();
  return t.id;
}

/* ---------- Codebook actions ---------- */
function defOf(id) { return P.codebook.tags.find((t) => t.id === id); }
function ensureDefined(id) {
  if (id.startsWith("t:")) return defOf(id);
  const t = D.tags.get(id);
  const def = { id: "t:" + uid(), name: t.name, terms: [t.terms[0]] };
  P.codebook.tags.push(def);
  // excluded words that were confirmed by hand: lift the exclusion so the new tag keeps working
  P.codebook.exclusions = P.codebook.exclusions.filter((e) => D.key(e.toLowerCase()) !== t.key);
  remapStatus(id, def.id);
  return def;
}
function remapStatus(from, to) {
  for (const s of Object.values(P.status)) for (const arr of ["c", "r"]) {
    if (!s[arr] || !s[arr].includes(from)) continue;
    s[arr] = [...new Set(s[arr].map((x) => (x === from ? to : x)))];
  }
  for (const s of Object.values(P.status)) if (s.c && s.r) s.r = s.r.filter((x) => !s.c.includes(x));
}
function mergeTags(fromId, intoId) {
  if (fromId === intoId) return;
  const from = D.tags.get(fromId), into = ensureDefined(intoId);
  if (fromId.startsWith("t:")) {
    const fd = defOf(fromId);
    into.terms = [...new Set([...into.terms, ...fd.terms])];
    P.codebook.tags = P.codebook.tags.filter((t) => t.id !== fromId);
    remapStatus(fromId, into.id);
  } else {
    into.terms = [...new Set([...into.terms, from.terms[0]])];
    P.codebook.exclusions = P.codebook.exclusions.filter((e) => D.key(e.toLowerCase()) !== from.key);
    remapStatus(fromId, into.id);
  }
  if (UI.f.tag === fromId || UI.f.tag === intoId) UI.f.tag = into.id;
  UI.clouds = {};
  changed({ derive: true });
  toast(`Merged “${from.name}” into “${into.name}”`);
}
function deleteTag(id) {
  const t = D.tags.get(id); if (!t) return;
  const n = tagCount(id).c;
  const msg = t.kind === "auto"
    ? `Exclude “${t.name}” from tagging?${n ? ` It will also be removed from the ${plural(n, "comment")} where you confirmed it.` : ""}`
    : `Delete the tag “${t.name}”?${n ? ` It will be removed from ${plural(n, "comment")}.` : ""}`;
  if (!confirm(msg)) return;
  if (t.kind === "auto") { if (!P.codebook.exclusions.map((e) => e.toLowerCase()).includes(t.terms[0].toLowerCase())) P.codebook.exclusions.push(t.terms[0]); }
  else P.codebook.tags = P.codebook.tags.filter((x) => x.id !== id);
  for (const s of Object.values(P.status)) { if (s.c) s.c = s.c.filter((x) => x !== id); if (s.r) s.r = s.r.filter((x) => x !== id); }
  if (UI.f.tag === id) UI.f.tag = null;
  UI.clouds = {};
  changed({ derive: true });
}
function excludeWord(id) {
  const t = D.tags.get(id); if (!t || t.kind !== "auto") return;
  const n = tagCount(id).c;
  if (n && !confirm(`“${t.name}” is confirmed on ${plural(n, "comment")}. Exclude it and remove it from those comments?`)) return;
  P.codebook.exclusions.push(t.terms[0]);
  for (const s of Object.values(P.status)) { if (s.c) s.c = s.c.filter((x) => x !== id); if (s.r) s.r = s.r.filter((x) => x !== id); }
  if (UI.f.tag === id) UI.f.tag = null;
  UI.clouds = {};
  changed({ derive: true });
  toast(`“${t.name}” won't be used for tagging`);
}
function parseTerms(s) { return [...new Set(String(s).split(/[\n,;]+/).map((x) => x.trim()).filter(Boolean))]; }

/* ---------- Saving ---------- */
function saveNow() {
  if (!P) return;
  try {
    localStorage.setItem(LS_PROJECT, JSON.stringify(P));
    const { exclusions, tags, splits } = P.codebook;
    localStorage.setItem(LS_CODEBOOK, JSON.stringify({ exclusions, tags, splits }));
    UI.save = "saved";
  } catch (e) { UI.save = "error"; }
  renderTopbar();
}
const saveSoon = debounce(saveNow, 500);
function downloadProject() {
  download(new Blob([JSON.stringify(P)], { type: "application/json" }), `${slug(P.title)}-tagging-project.json`);
}
function downloadCodebook() {
  const { exclusions, tags, splits } = P.codebook;
  const obj = { app: "comment-sorter-codebook", version: 1, saved: new Date().toISOString(), exclusions, tags: tags.map(({ name, terms }) => ({ name, terms })), splits };
  download(new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" }), `comment-sorter-codebook.json`);
}
async function loadCodebook(file) {
  try {
    const obj = JSON.parse(await file.text());
    if (obj.app !== "comment-sorter-codebook") throw new Error("That file isn't a codebook.");
    const cb = P.codebook;
    const exl = new Set(cb.exclusions.map((e) => e.toLowerCase()));
    (obj.exclusions || []).forEach((e) => { if (!exl.has(e.toLowerCase())) cb.exclusions.push(e); });
    let added = 0;
    (obj.tags || []).forEach((t) => {
      const hit = cb.tags.find((x) => x.name.toLowerCase() === String(t.name).toLowerCase());
      if (hit) hit.terms = [...new Set([...hit.terms, ...(t.terms || [])])];
      else { cb.tags.push({ id: "t:" + uid(), name: t.name, terms: (t.terms || []).slice() }); added++; }
    });
    cb.splits = [...new Set([...(cb.splits || []), ...(obj.splits || [])])];
    UI.clouds = {};
    changed({ derive: true });
    toast(`Codebook loaded: ${plural(added, "new tag")}, ${plural((obj.exclusions || []).length, "excluded word")}`);
  } catch (e) { alert(e.message || String(e)); }
}

function viewSide() {
  const f = UI.f;
  const base = D.comments.filter((c) => passes(c, f, { status: true }));
  const cnt = { todo: 0, untagged: 0, reviewed: 0, skipped: 0, all: base.length };
  for (const c of base) {
    const sk = isSkipped(c), s = st(c.id);
    if (sk) { cnt.skipped++; continue; }
    if (s.v) cnt.reviewed++; else cnt.todo++;
    const t = tagsOf(c); if (!t.conf.length && !t.sugg.length) cnt.untagged++;
  }
  const statuses = [["todo", "To review"], ["untagged", "Untagged"], ["reviewed", "Reviewed"], ["skipped", "Skipped"], ["all", "All comments"]];
  const cCols = commentCols();
  const qSel = cCols.length > 1 ? `<label class="field"><span>Question</span><select class="input" data-chg="fcol"><option value="all">All questions</option>${cCols.map((c) => `<option value="${c.idx}" ${String(f.col) === String(c.idx) ? "selected" : ""}>${esc(colLabel(c.idx))}</option>`).join("")}</select></label>` : "";
  const ctxSel = contextCols().map((cc) => {

    if (vals.size < 2 || vals.size > 40) return "";

    return `<label class="field"><span>${esc(cc.label || humanize(P.headers[cc.idx]))}</span><select class="input" data-chg="fctx" data-i="${cc.idx}"><option value="">Any</option>${[...vals.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true })).map(([v, n]) => `<option value="${esc(v)}" ${cur === v ? "selected" : ""}>${esc(v)} (${n})</option>`).join("")}</select></label>`;
  }).join("");
  // tags list
  const colF = f.col;
  const list = [...D.tags.values()].map((t) => ({ t, n: tagCount(t.id, colF) })).filter((x) => x.n.t > 0 || x.t.id === f.tag)
    .filter((x) => !UI.tagFind || x.t.name.toLowerCase().includes(UI.tagFind.toLowerCase()))
    .sort((a, b) => b.n.t - a.n.t || a.t.name.localeCompare(b.t.name));
  const maxN = Math.max(1, ...list.map((x) => x.n.t));
  const tagHtml = list.length ? list.map(({ t, n }) => `<div class="tagrowside">
      <button class="tagbtn" data-act="ftag" data-id="${esc(t.id)}" aria-pressed="${f.tag === t.id}" title="${n.c} confirmed, ${n.s} suggested">

      </button>
      ${t.kind === "auto" ? `<button class="xbtn" data-act="exclude" data-id="${esc(t.id)}" aria-label="Exclude ${esc(t.name)} from tagging" title="Exclude this word">${ICON_X}</button>` : ""}
    </div>`).join("") : `<p class="muted small">No tags match.</p>`;
  return `
    <div><h3>Show</h3><div class="statuslist">${statuses.map(([k, l]) => `<button data-act="fstatus" data-v="${k}" aria-pressed="${f.status === k}">${l}<span class="num">${cnt[k].toLocaleString()}</span></button>`).join("")}</div></div>
    ${qSel || ctxSel ? `<div style="display:grid;gap:12px">${qSel}${ctxSel}</div>` : ""}
    <label class="field"><span>Search comments</span><input class="input" type="search" data-inp="fq" value="${esc(f.q)}" placeholder="Words or phrases"></label>

      <input class="input" type="search" data-inp="tagfind" value="${esc(UI.tagFind)}" placeholder="Find a tag" aria-label="Find a tag" style="margin-bottom:8px">
      <div class="taglist" id="sidetags">${tagHtml}</div>
      <p class="small muted" style="margin-top:8px">Bars show confirmed tags. Hover a word and select × to stop using it as a tag.</p>
    </div>`;
}

function highlight(c, ids) {
  const ranges = [];
  for (const id of ids) for (const [a, b] of c.matches.get(id) || []) ranges.push([c.toks[a].start, c.toks[b].end, D.tags.get(id).name]);
  ranges.sort((x, y) => x[0] - y[0]);
  const merged = [];
  for (const r of ranges) { const last = merged[merged.length - 1]; if (last && r[0] <= last[1]) { last[1] = Math.max(last[1], r[1]); if (!last[2].includes(r[2])) last[2] += ", " + r[2]; } else merged.push(r.slice()); }
  const text = c.text; // tokenizer offsets line up: normText swaps characters one for one
  let out = "", pos = 0;
  for (const [a, b, name] of merged) { out += esc(text.slice(pos, a)) + `<mark title="${esc(name)}">${esc(text.slice(a, b))}</mark>`; pos = b; }
  return out + esc(text.slice(pos));
}
function ctxHtml(c) {
  const parts = contextCols().map((cc) => { const v = P.rows[c.r][cc.idx]; return v ? `<span>${cc.label ? `<b>${esc(cc.label)}</b> ` : ""}${esc(v)}</span>` : ""; }).filter(Boolean);
  return parts.length ? `<div class="ctx">${parts.join("")}</div>` : "";
}
function chipOrder(c, conf, sugg) {

}
function quickPicks(c, exclude, n) {

    .filter((x) => x.n > 0).sort((a, b) => b.n - a.n || a.t.name.localeCompare(b.t.name)).slice(0, n).map((x) => x.t.id);
}

/* ---------- Export data ---------- */
function exportGroups(colIdx) {
  const s = P.settings;
  const cs = D.comments.filter((c) => c.c === colIdx);
  const live = cs.filter((c) => !isSkipped(c));
  const groups = new Map(), untagged = [];
  for (const c of live) {
    const { conf, sugg } = tagsOf(c);
    const ids = s.includeSuggested ? [...conf, ...sugg] : conf;
    if (!ids.length) { untagged.push(c); continue; }
    for (const id of ids) { if (!groups.has(id)) groups.set(id, []); groups.get(id).push(c); }
  }
  let arr = [...groups.entries()].map(([id, list]) => ({ id, name: D.tags.get(id).name, list: list.sort((a, b) => a.r - b.r) }));
  arr.sort(s.sortTags === "alpha" ? (a, b) => a.name.localeCompare(b.name) : (a, b) => b.list.length - a.list.length || a.name.localeCompare(b.name));
  return { groups: arr, untagged, total: live.length, skipped: cs.length - live.length };
}
function ctxString(c) {
  return contextCols().map((cc) => { const v = P.rows[c.r][cc.idx]; return v ? (cc.label ? `${cc.label}: ${v}` : v) : null; }).filter(Boolean).join("; ");
}

/* ---------- Word clouds ---------- */
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function drawCloud(canvas, items, colors) {
  const W = canvas.width, H = canvas.height, ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
  if (!items.length) {
    ctx.fillStyle = "#7C879A"; ctx.font = `400 40px ${cloudFont()}`; ctx.textAlign = "center"; ctx.fillText("No tags yet", W / 2, H / 2); ctx.textAlign = "left";
    return false;
  }
  const maxC = items[0].n, minC = items[items.length - 1].n;
  let scale = 1, placed = [];
  for (let attempt = 0; attempt < 9; attempt++) {
    placed = []; let failed = false;
    const maxF = Math.min(170, H / (items.length < 5 ? 3 : 4.4)) * scale, minF = Math.max(20, maxF * 0.2);
    const rnd = mulberry32(7);
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const f = maxC === minC ? (maxF + minF) / 2 : minF + ((it.n - minC) / (maxC - minC)) * (maxF - minF);
      const weight = f > 70 ? 700 : 600;
      ctx.font = `${weight} ${f}px ${cloudFont()}`;
      const m = ctx.measureText(it.name);
      const w = m.width, asc = m.actualBoundingBoxAscent || f * 0.75, desc = m.actualBoundingBoxDescent || f * 0.2, h = asc + desc;
      const pad = Math.max(4, f * 0.1);
      const phase = rnd() * Math.PI * 2;
      let spot = null;
      for (let t = 0; t < 140; t += 0.045) {
        const r = 4.2 * t;
        const x = W / 2 + r * Math.cos(t + phase) * (W / H) - w / 2;
        const y = H / 2 + r * Math.sin(t + phase) - h / 2;
        if (x < 10 || y < 10 || x + w > W - 10 || y + h > H - 10) { if (r > W) break; continue; }
        const box = { x: x - pad, y: y - pad, w: w + pad * 2, h: h + pad * 2 };
        if (placed.every((p) => box.x + box.w <= p.box.x || p.box.x + p.box.w <= box.x || box.y + box.h <= p.box.y || p.box.y + p.box.h <= box.y)) { spot = { x, y, box }; break; }
      }
      if (!spot) { failed = true; break; }
      placed.push({ it, f, weight, x: spot.x, y: spot.y + asc, box: spot.box, color: colors[i % colors.length] });
    }
    if (!failed) break;
    scale *= 0.86;
  }
  for (const p of placed) { ctx.font = `${p.weight} ${p.f}px ${cloudFont()}`; ctx.fillStyle = p.color; ctx.fillText(p.it.name, p.x, p.y); }
  return true;
}
function cloudFont() { return '"Segoe UI", "Segoe UI Variable Display", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif'; }
function cloudItems(colIdx) { return exportGroups(colIdx).groups.slice(0, 60).map((g) => ({ name: g.name, n: g.list.length })); }
function drawAllClouds() {
  const colors = PALETTES[P.settings.palette].colors;
  for (const c of commentCols()) { const cv = $("#cloud-" + c.idx); if (cv) drawCloud(cv, cloudItems(c.idx), colors); }
}
function cloudCanvas(colIdx) {
  const cv = document.createElement("canvas"); cv.width = 1600; cv.height = 900;
  const has = drawCloud(cv, cloudItems(colIdx), PALETTES[P.settings.palette].colors);
  return { cv, has };
}
const canvasPng = (cv) => new Promise((res) => cv.toBlob((b) => res(b), "image/png"));

/* ---------- Word document ---------- */
async function buildDocx() {
  const d = window.docx;
  if (!d) { alert("The Word library didn't load. Check your internet connection and reload the page."); return; }
  const s = P.settings, cols = commentCols(), multi = cols.length > 1;
  const kids = [];
  const text = (t, o = {}) => new d.TextRun({ text: t, ...o });
  const heading = (t, level) => new d.Paragraph({ heading: level, children: [text(t)] });
  const bullet = (c) => {
    const runs = [];
    c.text.split("\n").forEach((line, i) => runs.push(new d.TextRun({ text: line, break: i ? 1 : 0 })));
    if (s.includeContext) { const cx = ctxString(c); if (cx) runs.push(text(` (${cx})`, { italics: true })); }
    return new d.Paragraph({ numbering: { reference: "bullets", level: 0 }, spacing: { after: 80 }, children: runs });
  };
  const totalLive = D.comments.filter((c) => !isSkipped(c)).length;
  kids.push(heading(P.title || "Survey comments", d.HeadingLevel.HEADING_1));
  kids.push(new d.Paragraph({ children: [text(`${plural(totalLive, "comment")}${multi ? ` across ${cols.length} questions` : ""}. ${s.includeSuggested ? "Includes confirmed and suggested tags." : "Tags shown are the ones confirmed during review."} Comments with more than one tag appear under each. Generated ${new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })}.`)] }));
  for (const col of cols) {
    const g = exportGroups(col.idx), label = colLabel(col.idx);
    if (multi) kids.push(heading(label, d.HeadingLevel.HEADING_2));
    kids.push(new d.Paragraph({ children: [text(`${plural(g.total, "comment")}${multi ? "" : ` on \u201c${label}\u201d`}${g.skipped ? `, plus ${g.skipped} skipped as non-responses` : ""}.`)] }));
    if (s.includeClouds && g.groups.length) {
      const { cv } = cloudCanvas(col.idx);
      const png = new Uint8Array(await (await canvasPng(cv)).arrayBuffer());
      const top = g.groups.slice(0, 12).map((x) => `${x.name} (${x.list.length})`).join(", ");
      kids.push(new d.Paragraph({ children: [new d.ImageRun({ type: "png", data: png, transformation: { width: 624, height: 351 }, altText: { name: "Word cloud", title: `Word cloud: ${label}`, description: `Word cloud of tags for ${label}. Largest: ${top}.` } })] }));
    }
    const H = multi ? d.HeadingLevel.HEADING_3 : d.HeadingLevel.HEADING_2;
    for (const grp of g.groups) { kids.push(heading(`${capFirst(grp.name)} (${grp.list.length})`, H)); grp.list.forEach((c) => kids.push(bullet(c))); }
    if (s.includeUntagged && g.untagged.length) { kids.push(heading(`Untagged (${g.untagged.length})`, H)); g.untagged.forEach((c) => kids.push(bullet(c))); }
  }
  const head = (size, font) => ({ run: { font, size, color: "0F4761" }, paragraph: { spacing: { before: size >= 40 ? 360 : 160, after: 80 }, keepNext: true, keepLines: true } });
  const doc = new d.Document({
    creator: "Comment Sorter", title: P.title,
    styles: { default: {
      document: { run: { font: "Aptos", size: 24 }, paragraph: { spacing: { after: 160, line: 278, lineRule: d.LineRuleType.AUTO } } },
      heading1: head(40, "Aptos Display"), heading2: head(32, "Aptos Display"), heading3: head(28, "Aptos")
    } },
    numbering: { config: [{ reference: "bullets", levels: [{ level: 0, format: d.LevelFormat.BULLET, text: "\u2022", alignment: d.AlignmentType.LEFT, style: { paragraph: { indent: { left: 720, hanging: 360 } } } }] }] },
    sections: [{ properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 } } }, children: kids }]
  });
  const blob = await d.Packer.toBlob(doc);
  download(blob, `${slug(P.title)}.docx`);
}
function csvCell(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }
function countRows() {
  const rows = [["Question", "Tag", "Comments", "Percent of comments"]];
  for (const col of commentCols()) {
    const g = exportGroups(col.idx), label = colLabel(col.idx);
    const pct = (n) => (g.total ? Math.round((n / g.total) * 1000) / 10 : 0);
    g.groups.forEach((x) => rows.push([label, x.name, x.list.length, pct(x.list.length)]));
    if (g.untagged.length) rows.push([label, "Untagged", g.untagged.length, pct(g.untagged.length)]);
  }
  return rows;
}
function downloadCsv() {
  const csv = "\uFEFF" + countRows().map((r) => r.map(csvCell).join(",")).join("\r\n");
  download(new Blob([csv], { type: "text/csv;charset=utf-8" }), `${slug(P.title)}-tag-counts.csv`);
}
function downloadXlsx() {
  const ctxC = contextCols();
  const head = ["Question", "Comment", "Tags", "Suggested tags", "Status", ...ctxC.map((c) => c.label || P.headers[c.idx]), "Source row"];
  const rows = [head];
  for (const c of D.comments) {
    const { conf, sugg } = tagsOf(c), sk = isSkipped(c);
    rows.push([colLabel(c.c), c.text, sk ? "" : conf.map((id) => D.tags.get(id).name).join("; "), sk ? "" : sugg.map((id) => D.tags.get(id).name).join("; "),
      sk ? "Skipped" : st(c.id).v ? "Reviewed" : "Not reviewed", ...ctxC.map((cc) => P.rows[c.r][cc.idx] || ""), P.rowNums ? P.rowNums[c.r] : c.r + 2]);
  }
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(rows);
  ws1["!cols"] = [{ wch: 24 }, { wch: 70 }, { wch: 30 }, { wch: 30 }, { wch: 14 }, ...ctxC.map(() => ({ wch: 22 })), { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, ws1, "Comments");
  const ws2 = XLSX.utils.aoa_to_sheet(countRows());
  ws2["!cols"] = [{ wch: 30 }, { wch: 28 }, { wch: 12 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Tag counts");
  XLSX.writeFile(wb, `${slug(P.title)}-tagged-comments.xlsx`);
}

/* ---------- Events ---------- */
function go(delta) {
  const n = UI.queue.length; if (!n) return;
  UI.qpos = Math.max(0, Math.min(n, UI.qpos + delta));
  render(); window.scrollTo({ top: 0 });
}
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  const menu = el.closest("details.menu"); if (menu) menu.open = false;
  const cmt = () => D.byId.get(el.dataset.cid) || D.byId.get(UI.queue[UI.qpos]);
  switch (a) {
    case "resume": try { P = JSON.parse(localStorage.getItem(LS_PROJECT)); P.settings = Object.assign({}, DEFAULT_SETTINGS, P.settings || {}); resetFilters(); derive(); UI.view = "work"; render(); } catch (err) { UI.err = "That saved project couldn't be opened."; render(); } break;
    case "discard": if (confirm("Discard the saved project in this browser? Download a project file first if you might need it.")) { localStorage.removeItem(LS_PROJECT); render(); } break;
    case "open-project": $("#fileProject").click(); break;
    case "dl-project": downloadProject(); break;
    case "edit-columns": editColumns(); break;
    case "start-over": if (confirm("Start over with a new file? The current project will be removed from this browser. Download a project file first if you want to keep it.")) { localStorage.removeItem(LS_PROJECT); P = null; D = null; UI.view = "landing"; render(); } break;
    case "cancel-setup": if (T.editing) { T = null; UI.view = "work"; } else { T = null; UI.view = "landing"; } render(); break;
    case "start": startProject(); break;
    case "tab": UI.tab = el.dataset.tab; render(); break;
    case "fstatus": UI.f.status = el.dataset.v; UI.browseLimit = 60; render(); break;
    case "review-todo": UI.f = { status: "todo", col: "all", tag: null, ctx: {}, q: "" }; UI.tab = "review"; render(); break;
    case "ftag": UI.f.tag = UI.f.tag === id ? null : id; UI.browseLimit = 60; render(); break;
    case "ftag-clear": UI.f.tag = null; render(); break;
    case "exclude": excludeWord(id); break;
    case "prev": go(-1); break;
    case "next": go(1); break;
    case "chip-remove": { const c = cmt(); removeTag(c, id); changed(); break; }
    case "chip-add": { const c = cmt(); addTag(c, id); changed(); break; }
    case "confirm": { const c = cmt(); if (c && !isSkipped(c)) confirmAll(c); recount(); saveSoon(); go(1); break; }
    case "skip": { const c = cmt(); const was = isSkipped(c); toggleSkip(c); recount(); saveSoon(); if (!was) go(1); else render(); break; }
    case "b-confirm": { const c = cmt(); confirmAll(c); changed(); break; }
    case "b-skip": { const c = cmt(); toggleSkip(c); changed(); break; }
    case "b-open": { buildQueue(el.dataset.cid); UI.tab = "review"; render(); window.scrollTo({ top: 0 }); break; }
    case "bulk-confirm": { const t = UI.f.tag; let n = 0; filtered().forEach((c) => { if (!isSkipped(c) && !(st(c.id).c || []).includes(t)) { addTag(c, t); n++; } }); changed(); toast(`Confirmed on ${plural(n, "comment")}`); break; }
    case "more": UI.browseLimit += 60; render(); break;
    case "new-tag": openTagDialog(null); break;
    case "edit-tag": openTagDialog(id); break;
    case "delete-tag": deleteTag(id); break;
    case "split": { P.codebook.splits = [...new Set([...(P.codebook.splits || []), el.dataset.w])]; $("#dlg").close(); UI.clouds = {}; changed({ derive: true }); toast(`“${el.dataset.w.split("|")[1]}” is now its own word`); break; }
    case "unsplit": P.codebook.splits = (P.codebook.splits || []).filter((w) => w !== el.dataset.w); changed({ derive: true }); break;
    case "exadd": addExclusions(); break;
    case "exdel": P.codebook.exclusions = P.codebook.exclusions.filter((w) => w !== el.dataset.w); changed({ derive: true }); break;
    case "mincount-auto": P.codebook.minCount = null; changed({ derive: true }); break;
    case "dl-codebook": downloadCodebook(); break;
    case "load-codebook": $("#fileCodebook").click(); break;
    case "reset-codebook": if (confirm("Reset to the starter codebook? Your own tags and excluded words will be replaced, and your tags will be removed from comments.")) { P.codebook = starterCodebook(); UI.f.tag = null; changed({ derive: true }); } break;
    case "dl-docx": el.disabled = true; el.textContent = "Building…"; try { await buildDocx(); } catch (err) { console.error(err); alert("The Word document couldn't be built: " + err.message); } el.disabled = false; el.textContent = "Download Word document"; break;
    case "dl-cloud": { const col = +el.dataset.col; const { cv } = cloudCanvas(col); download(await canvasPng(cv), `${slug(P.title)}-${slug(colLabel(col))}-word-cloud.png`); break; }
    case "dl-csv": downloadCsv(); break;
    case "dl-xlsx": downloadXlsx(); break;
  }
});
function addExclusions() {
  const inp = $("#exadd"); if (!inp) return;
  const words = parseTerms(inp.value); if (!words.length) return;
  const have = new Set(P.codebook.exclusions.map((w) => w.toLowerCase()));
  words.forEach((w) => { if (!have.has(w.toLowerCase())) P.codebook.exclusions.push(w); });
  changed({ derive: true });
  const again = $("#exadd"); if (again) again.focus();
}
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "fileMain" && el.files[0]) { openFile(el.files[0]); return; }
  if (el.id === "fileProject" && el.files[0]) { openProjectFile(el.files[0]); el.value = ""; return; }
  if (el.id === "fileCodebook" && el.files[0]) { loadCodebook(el.files[0]); el.value = ""; return; }
  const k = el.dataset.chg; if (!k) return;
  if (k === "role") { const c = T.cols[+el.dataset.i]; c.role = el.value; if (!c.edited) c.label = el.value === "context" ? c.d.context : c.d.comment; render(); }
  else if (k === "sheet") { T.sheetIdx = +el.value; T.cols = draftFromSheet(T.sheets[T.sheetIdx]); render(); }
  else if (k === "codebook") { T.codebook = el.value; }
  else if (k === "fcol") { UI.f.col = el.value; UI.browseLimit = 60; render(); }
  else if (k === "fctx") { UI.f.ctx[el.dataset.i] = el.value; UI.browseLimit = 60; render(); }
  else if (k === "merge" && el.value) { const from = D.tags.get(el.dataset.id), into = D.tags.get(el.value); if (confirm(`Merge “${from.name}” into “${into.name}”? Comments tagged “${from.name}” will be tagged “${into.name}” instead.`)) mergeTags(el.dataset.id, el.value); else el.value = ""; }
  else if (k === "mincount") { const n = parseInt(el.value, 10); P.codebook.minCount = n >= 2 ? n : null; changed({ derive: true }); }
  else if (k === "setting") { P.settings[el.dataset.k] = el.checked; saveSoon(); render(); }
  else if (k === "setting-sel") { P.settings[el.dataset.k] = el.value; saveSoon(); render(); }
});
const searchLater = debounce(() => { const m = $("#main"); if (m) { m.innerHTML = UI.tab === "review" ? viewReview() : viewBrowse(); } }, 200);
document.addEventListener("input", (e) => {
  const el = e.target, k = el.dataset.inp; if (!k) return;
  if (k === "label") { const c = T.cols[+el.dataset.i]; c.label = el.value; c.edited = true; }
  else if (k === "title") T.title = el.value;
  else if (k === "ptitle") { P.title = el.value; saveSoon(); }
  else if (k === "fq") { UI.f.q = el.value; UI.browseLimit = 60; searchLater(); }
  else if (k === "tagfind") { UI.tagFind = el.value; const box = $("#sidetags"); if (box) { const tmp = document.createElement("div"); tmp.innerHTML = viewSide(); box.innerHTML = tmp.querySelector("#sidetags").innerHTML; } }
});
document.addEventListener("toggle", (e) => { if (e.target.dataset && e.target.dataset.tog === "others") UI.othersOpen = e.target.open; }, true);

document.addEventListener("keydown", (e) => {
  const el = e.target;
  // Enter in tag inputs adds the tag
  if (el.dataset && (el.dataset.key === "addtag" || el.dataset.key === "addtag-b") && e.key === "Enter") {
    e.preventDefault();
    const c = el.dataset.key === "addtag" ? D.byId.get(UI.queue[UI.qpos]) : D.byId.get(el.dataset.cid);
    const tid = tagFromInput(el.value);
    if (c && tid) { addTag(c, tid); changed(); const again = el.dataset.key === "addtag" ? $("#addtag") : null; if (again) again.focus(); }
    return;
  }
  if (el.dataset && el.dataset.key === "addtag" && e.key === "Escape") { el.value = ""; el.blur(); return; }
  if (el.dataset && el.dataset.key === "exadd" && e.key === "Enter") { e.preventDefault(); addExclusions(); return; }
  if (UI.view !== "work" || UI.tab !== "review") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || $("#dlg").open) return;
  if (el.tagName === "BUTTON" && e.key === "Enter") return; // let buttons act normally
  const c = D.byId.get(UI.queue[UI.qpos]);
  if (e.key === "ArrowRight" || e.key === "j") { e.preventDefault(); go(1); return; }
  if (e.key === "ArrowLeft" || e.key === "k") { e.preventDefault(); go(-1); return; }
  if (!c) return;
  if (e.key === "Enter") { e.preventDefault(); if (!isSkipped(c)) confirmAll(c); recount(); saveSoon(); go(1); return; }
  if (e.key === "s" || e.key === "S") { e.preventDefault(); const was = isSkipped(c); toggleSkip(c); recount(); saveSoon(); if (!was) go(1); else render(); return; }
  if (e.key === "t" || e.key === "T" || e.key === "/") { e.preventDefault(); const i = $("#addtag"); if (i) i.focus(); return; }
  if (/^[1-9]$/.test(e.key) && UI.keymap) {
    const slot = UI.keymap[+e.key - 1]; if (!slot) return;
    e.preventDefault();
    if (slot.on) removeTag(c, slot.id); else addTag(c, slot.id);
    changed();
  }
});

/* drag and drop on landing */
document.addEventListener("dragover", (e) => { const d = $("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (e) => { const d = $("#drop"); if (d && !d.contains(e.relatedTarget)) d.classList.remove("over"); });
document.addEventListener("drop", (e) => { const d = $("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) openFile(f); });
document.addEventListener("click", (e) => { document.querySelectorAll("details.menu[open]").forEach((m) => { if (!m.contains(e.target)) m.open = false; }); });

window.addEventListener("DOMContentLoaded", render);
</script>
